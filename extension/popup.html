<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; width: 290px; margin: 0; padding: 14px 16px; color: #0f172a; }
  h1 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 22px; height: 22px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #f1f5f9; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; flex: none; }
  .on .dot { background: #22c55e; }
  .off .dot { background: #ef4444; }
  ol { padding-left: 18px; margin: 10px 0 0; color: #334155; }
  li { margin-bottom: 4px; }
  .muted { color: #64748b; font-size: 12px; margin-top: 10px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .status { background: #1e293b; }
    ol { color: #cbd5e1; }
  }
</style>
</head>
<body>
  <h1><img src="icons/48.png" alt="">Kantoi</h1>
  <div id="status" class="status"><span class="dot"></span><span id="msg">Checking the Kantoi app…</span></div>
  <ol id="steps" hidden>
    <li>Open the Kantoi app on this computer.</li>
    <li>Keep it running in the background.</li>
    <li>Refresh WhatsApp Web or Telegram Web.</li>
  </ol>
  <p class="muted">Messages go only to the Kantoi app on this computer. Nothing is sent online unless you press "Explain".</p>
  <script src="popup.js"></script>
</body>
</html>
