name: Build Kantoi

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds the APK and attaches it.
  release:
    types: [published]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=VIRUSTOTAL_API_KEY=${{ secrets.VIRUSTOTAL_API_KEY }} --dart-define=SAFE_BROWSING_API_KEY=${{ secrets.SAFE_BROWSING_API_KEY }} --dart-define=URLSCAN_API_KEY=${{ secrets.URLSCAN_API_KEY }} --dart-define=ABUSECH_AUTH_KEY=${{ secrets.ABUSECH_AUTH_KEY }} --dart-define=TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../Kantoi-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kantoi-android
          path: Kantoi-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Kantoi-android.apk
